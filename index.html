<!DOCTYPE html>
<html>
<head>
  <title>Happy Birthday Centimeter 😂</title>

  <style>
    body {
      text-align: center;
      background: linear-gradient(to right, #ff6a00, #ee0979);
      color: white;
      font-family: Arial;
    }

    h1 {
      margin-top: 30px;
      font-size: 38px;
    }

    h2 {
      margin-top: 15px;
    }

    img {
      width: 220px;
      border-radius: 20px;
      margin-top: 20px;
    }

    button {
      padding: 12px 20px;
      font-size: 16px;
      background: yellow;
      border: none;
      cursor: pointer;
      border-radius: 10px;
      margin: 10px;
    }

    .hidden {
      display: none;
      font-size: 20px;
      margin-top: 20px;
    }
  </style>
</head>

<body>

  <h1>🎉 Happy 20th Birthday Centimeter 🎉</h1>

  <!-- IMAGE -->
  <img src="photo.jpg">

  <p>Officially 20… still acting like 12 😂</p>

  <!-- COUNTDOWN -->
  <h2 id="countdown">Loading countdown...</h2>

  <!-- ROAST BUTTON -->
  <button onclick="showRoast()">Click for wish 🔥</button>

  <!-- ROAST TEXT -->
  <div id="roast" class="hidden">
    <p> your name is Centimeter… but height still buffering 📏😂</p>
    <p>20 years completed… still no update 🤡</p>
    <p>Battery 100% ⚡ Brain 2%</p>
    <p>Anyway… Happy Birthday ❤️ Stay same legend 😂</p>
  </div>

  <script>
    function showRoast() {
      document.getElementById("roast").style.display = "block";
    }

    // COUNTDOWN TIMER
    var birthday = new Date("2026-04-21 00:00:00").getTime(); // CHANGE DATE

    var timer = setInterval(function() {

      var now = new Date().getTime();
      var distance = birthday - now;

      if (distance <= 0) {
        clearInterval(timer);
        document.getElementById("countdown").innerHTML =
          "🎉 IT'S BIRTHDAY TIME 😂🔥";
        return;
      }

      var days = Math.floor(distance / (1000 * 60 * 60 * 24));
      var hours = Math.floor((distance / (1000 * 60 * 60)) % 24);
      var minutes = Math.floor((distance / (1000 * 60)) % 60);
      var seconds = Math.floor((distance / 1000) % 60);

      document.getElementById("countdown").innerHTML =
        "⏳ " + days + "d " + hours + "h " +
        minutes + "m " + seconds + "s";

    }, 1000);
  </script>

</body>
</html>
